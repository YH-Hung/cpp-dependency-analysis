name: CI

on:
  push:
    branches: [main, 001-function-grouper]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test on ${{ matrix.os }} with Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run ruff linter
        run: ruff check src/ tests/

      - name: Run mypy type checker
        run: mypy src/function_grouper
        continue-on-error: true  # Don't fail CI on mypy errors yet

      - name: Run tests with coverage
        run: pytest --cov=src/function_grouper --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  verify-samples:
    name: Verify Example Files Execute Successfully
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify examples/simple.cpp
        run: |
          function-grouper examples/simple.cpp > /dev/null
          function-grouper -f json examples/simple.cpp > /dev/null
          echo "✅ simple.cpp verified"

      - name: Verify examples/complex.cpp
        run: |
          function-grouper examples/complex.cpp > /dev/null
          function-grouper -f json examples/complex.cpp > /dev/null
          function-grouper -f dot examples/complex.cpp > /dev/null
          echo "✅ complex.cpp verified"

      - name: Verify examples/edge_cases.cpp
        run: |
          function-grouper examples/edge_cases.cpp > /dev/null
          echo "✅ edge_cases.cpp verified"

      - name: Verify examples/real_world.cpp
        run: |
          function-grouper examples/real_world.cpp > /dev/null
          echo "✅ real_world.cpp verified"

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Check package
        run: |
          pip install twine
          twine check dist/*
